name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 型検査とテスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 生成型がスキーマと一致しているか
        run: pnpm check:types
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
