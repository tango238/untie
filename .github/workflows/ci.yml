name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: 型検査・テスト・ビルド
    runs-on: ubuntu-latest
    env:
      # wrangler のテレメトリを送らない (サーバーの test・build が wrangler を使う)
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc -b。packages/*・apps/* のすべてを references 経由で検査する
      - run: pnpm typecheck
      # 全パッケージのテスト。apps/server は workerd の中で D1 と Durable Object を使って動く (Cloudflare へのログインは要らない)
      - run: pnpm test
      - name: 生成型がスキーマと一致しているか
        run: pnpm check:types
      # Web 版・クラウド版・デスクトップのフロントを build し、apps/server の `wrangler deploy --dry-run` でバンドルと設定が通るかを確かめる
      # (dry-run は Cloudflare にログインも CLOUDFLARE_API_TOKEN も要らない)
      - run: pnpm build

  # untie が書き出す業務ルールの骨組み (.sou。packages/core の __fixtures__/souther) を、Souther のコンパイラに通す。
  # 書き出しの形はテスト (southerExport.test.ts) がこのファイルで固定しているので、ここで通れば書き出しが正しい Souther になっている。
  # Souther は JDK 25 で動く。配布物は scripts/souther-check.sh が版と SHA-256 を決めて取得する
  souther:
    name: Souther (業務ルールの骨組み)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: scripts/souther-check.sh

  # PR が Rust 側 (apps/desktop。src-tauri と Cargo.lock も含む) か、この CI の設定に触れているか。
  # Rust のジョブは Tauri の Linux 向けライブラリの取得に時間がかかるので、触れていない PR では飛ばす。
  # main への push では常に動かす (飛ばした PR のあとでも、main で Rust 側の壊れに気づけるように)
  changes:
    name: 変更の検出
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PR のマージ結果 (github.sha) と、PR の土台 (base.sha) の差
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/desktop/|\.github/workflows/ci\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "Rust 側に変更が無いので、cargo check は飛ばします"
          fi

  # デスクトップアプリの Rust 側がコンパイルできるか (リリースは release.yml が Mac と Windows で作る)
  # 飛ばしたジョブは、必須のチェックにしていても成功として扱われる
  rust:
    name: Rust (cargo check)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tauri の Linux 向けライブラリ
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      # tauri::generate_context! は frontendDist (../dist) の存在を要求する。中身は要らないので空で作る
      - run: mkdir -p apps/desktop/dist
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
