packages:
  - packages/*
  - apps/*

# インストール時のビルドスクリプトを走らせるパッケージ。true は Vite / wrangler (workerd) が使うもの、false は不要なので走らせない
allowBuilds:
  '@google/genai': false
  protobufjs: false
  esbuild: true
  workerd: true

# mokkun は版を固定している (packages/ui)。リリースから期間がたったら、この例外は消す
minimumReleaseAgeExclude:
  - mokkun@0.2.1
