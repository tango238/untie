<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Untie のアプリアイコン: 絡まった紐がほどけて、上から順に詳細化される階層 (業務 → BUC → アクティビティ) になる -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#26385f"/>
      <stop offset="1" stop-color="#0d1426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="800">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <clipPath id="c1"><rect x="344" y="430" width="476" height="112" rx="30"/></clipPath>
    <clipPath id="c2"><rect x="396" y="574" width="424" height="112" rx="30"/></clipPath>
    <clipPath id="c3"><rect x="448" y="716" width="372" height="112" rx="30"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 (macOS のアイコン格子: 824px 角、角丸 185) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- ほどける紐: 右上のゆるんだ端から大きく 1 回輪を描き、左の幹になって下りて各カードへ枝分かれする -->
  <g filter="url(#soft)" fill="none" stroke="url(#ribbon)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 812 330
             C 812 250, 760 190, 670 184
             C 560 176, 470 230, 476 310
             C 482 390, 600 410, 640 340
             C 680 270, 600 214, 520 220
             C 380 232, 288 290, 288 400
             L 288 772"/>
    <path d="M 288 486 H 352 M 288 630 H 404 M 288 772 H 456"/>
  </g>

  <!-- 階層のカード (業務 → BUC → アクティビティ。下ほど詳細で右に寄る) -->
  <g filter="url(#shadow)">
    <rect x="344" y="430" width="476" height="112" rx="30" fill="#ffffff"/>
    <rect x="396" y="574" width="424" height="112" rx="30" fill="#ffffff"/>
    <rect x="448" y="716" width="372" height="112" rx="30" fill="#ffffff"/>
  </g>
  <!-- カードの色帯と文字の代わりの線 (アプリの種類色) -->
  <rect x="344" y="430" width="24" height="112" fill="#3b6ea5" clip-path="url(#c1)"/>
  <rect x="398" y="471" width="220" height="30" rx="15" fill="#3b6ea5" opacity="0.9"/>
  <rect x="396" y="574" width="24" height="112" fill="#2f8f9d" clip-path="url(#c2)"/>
  <rect x="450" y="615" width="190" height="30" rx="15" fill="#2f8f9d" opacity="0.9"/>
  <rect x="448" y="716" width="24" height="112" fill="#d08a2e" clip-path="url(#c3)"/>
  <rect x="502" y="757" width="160" height="30" rx="15" fill="#d08a2e" opacity="0.9"/>
</svg>
