<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Untie のアプリアイコン: 絡まった結び目がほどけて、カードと線になる様子 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4c7e"/>
      <stop offset="1" stop-color="#1b2f4f"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- 結び目 (左上) -->
  <path d="M230 300 C 300 180, 420 200, 400 320 S 250 420, 330 470" fill="none" stroke="#ffd166" stroke-width="54" stroke-linecap="round"/>
  <path d="M330 470 C 420 520, 520 430, 470 340 S 300 290, 280 390" fill="none" stroke="#ffd166" stroke-width="54" stroke-linecap="round" opacity="0.85"/>
  <!-- ほどけた線 (右下へ) -->
  <path d="M330 470 C 420 640, 560 640, 640 580 S 780 540, 790 680" fill="none" stroke="#9ad8ff" stroke-width="54" stroke-linecap="round"/>
  <!-- カード -->
  <rect x="560" y="300" width="250" height="150" rx="28" fill="#ffffff"/>
  <rect x="590" y="335" width="150" height="20" rx="10" fill="#2b4c7e"/>
  <rect x="590" y="380" width="190" height="16" rx="8" fill="#9ad8ff"/>
  <rect x="700" y="640" width="250" height="150" rx="28" fill="#ffffff"/>
  <rect x="730" y="675" width="150" height="20" rx="10" fill="#2b4c7e"/>
  <rect x="730" y="720" width="190" height="16" rx="8" fill="#9ad8ff"/>
  <rect x="200" y="640" width="250" height="150" rx="28" fill="#ffffff"/>
  <rect x="230" y="675" width="150" height="20" rx="10" fill="#2b4c7e"/>
  <rect x="230" y="720" width="190" height="16" rx="8" fill="#9ad8ff"/>
  <!-- カード同士の線 -->
  <path d="M450 715 L 700 715" stroke="#ffd166" stroke-width="30" stroke-linecap="round"/>
  <path d="M685 450 L 760 640" stroke="#ffd166" stroke-width="30" stroke-linecap="round"/>
</svg>
